<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>均线策略回测系统 - StockAnalyzer Pro</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #0d1117; color: #e0e0e0; min-height: 100vh;
            display: flex; flex-direction: column;
        }
        
        /* 头部 */
        .header {
            background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
            padding: 16px 24px;
            border-bottom: 1px solid #30363d;
            display: flex; align-items: center; gap: 24px;
            flex-wrap: wrap;
        }
        .header h1 { font-size: 20px; color: #f0f6fc; font-weight: 600; }
        .header h1 span { color: #388bfd; }
        .header-info { font-size: 13px; color: #8b949e; }
        .header-badge {
            padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500;
            background: #238636; color: #fff;
        }
        
        /* 主布局 */
        .main-layout {
            display: flex; flex: 1; overflow: hidden;
        }
        
        /* 左侧边栏 */
        .sidebar {
            width: 300px; background: #161b22; border-right: 1px solid #30363d;
            overflow-y: auto; padding: 16px; flex-shrink: 0;
        }
        .sidebar-section {
            margin-bottom: 20px;
        }
        .sidebar-title {
            font-size: 13px; color: #f0f6fc; font-weight: 600;
            margin-bottom: 12px; padding-bottom: 8px;
            border-bottom: 1px solid #21262d;
            display: flex; align-items: center; gap: 8px;
        }
        .sidebar-title::before {
            content: ''; display: inline-block; width: 3px; height: 14px;
            background: #388bfd; border-radius: 2px;
        }
        
        /* 表单控件 */
        .form-group {
            margin-bottom: 12px;
        }
        .form-label {
            display: block; font-size: 12px; color: #8b949e;
            margin-bottom: 4px;
        }
        .form-input, .form-select {
            width: 100%; padding: 8px 10px;
            background: #0d1117; border: 1px solid #30363d;
            border-radius: 6px; color: #e0e0e0; font-size: 13px;
        }
        .form-input:focus, .form-select:focus {
            outline: none; border-color: #388bfd;
        }
        .form-row {
            display: flex; gap: 8px;
        }
        .form-row .form-group { flex: 1; }
        
        .checkbox-group {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px; height: 16px; accent-color: #388bfd;
        }
        .checkbox-group label {
            font-size: 13px; color: #c9d1d9; cursor: pointer;
        }
        
        /* 按钮 */
        .btn {
            padding: 10px 16px; border: none; border-radius: 6px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #238636; color: #fff; width: 100%;
        }
        .btn-primary:hover { background: #2ea043; }
        .btn-secondary {
            background: #21262d; color: #c9d1d9; width: 100%;
            border: 1px solid #30363d;
        }
        .btn-secondary:hover { background: #30363d; }
        
        .btn-group {
            display: flex; gap: 8px; margin-top: 16px;
        }
        .btn-group .btn { flex: 1; }
        
        /* 右侧内容区 */
        .content {
            flex: 1; overflow-y: auto; padding: 16px;
        }
        
        /* 图表容器 */
        .chart-box {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; padding: 16px; margin-bottom: 16px;
        }
        .chart-title {
            font-size: 14px; color: #f0f6fc; font-weight: 500;
            margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
        }
        
        /* 指标面板 */
        .metrics-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px; margin-bottom: 16px;
        }
        .metric-card {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; padding: 16px;
        }
        .metric-label {
            font-size: 12px; color: #8b949e; margin-bottom: 4px;
        }
        .metric-value {
            font-size: 24px; font-weight: 600; color: #f0f6fc;
        }
        .metric-value.positive { color: #ef5350; }
        .metric-value.negative { color: #26a69a; }
        .metric-sub {
            font-size: 12px; color: #6e7681; margin-top: 4px;
        }
        
        /* 表格 */
        .table-container {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; padding: 16px; margin-bottom: 16px;
            overflow-x: auto;
        }
        .table-title {
            font-size: 14px; color: #f0f6fc; font-weight: 500;
            margin-bottom: 12px;
        }
        table {
            width: 100%; border-collapse: collapse; font-size: 13px;
        }
        th {
            background: #21262d; color: #8b949e; font-weight: 500;
            padding: 8px 12px; text-align: left;
            border-bottom: 1px solid #30363d;
        }
        td {
            padding: 8px 12px; border-bottom: 1px solid #21262d;
            color: #c9d1d9;
        }
        tr:hover td { background: #1c2128; }
        .buy-signal { color: #ef5350; font-weight: 500; }
        .sell-signal { color: #26a69a; font-weight: 500; }
        
        /* 加载动画 */
        .loading {
            display: flex; align-items: center; justify-content: center;
            padding: 40px; color: #8b949e; font-size: 14px;
        }
        .spinner {
            width: 20px; height: 20px; border: 2px solid #30363d;
            border-top-color: #388bfd; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 响应式 */
        @media (max-width: 1024px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #30363d; }
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <div class="header">
        <h1>📊 <span>均线策略回测系统</span></h1>
        <span class="header-info">双均线策略 + 趋势过滤器 + ATR过滤器</span>
        <span class="header-badge">v1.0</span>
    </div>
    
    <!-- 主布局 -->
    <div class="main-layout">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <!-- 股票选择 -->
            <div class="sidebar-section">
                <div class="sidebar-title">📈 股票选择</div>
                <div class="form-group">
                    <label class="form-label">选择股票</label>
                    <select class="form-select" id="stockSelect" onchange="onStockChange()">
                        <option value="300750.SZ">宁德时代 (300750.SZ) - 科技/新能源</option>
                        <option value="601318.SH">中国平安 (601318.SH) - 金融</option>
                        <option value="600519.SH">贵州茅台 (600519.SH) - 消费</option>
                        <option value="601857.SH">中国石油 (601857.SH) - 能源</option>
                        <option value="002594.SZ">比亚迪 (002594.SZ) - 制造</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">开始日期</label>
                        <input type="date" class="form-input" id="startDate" value="2024-07-03">
                    </div>
                    <div class="form-group">
                        <label class="form-label">结束日期</label>
                        <input type="date" class="form-input" id="endDate" value="2026-07-03">
                    </div>
                </div>
            </div>
            
            <!-- 均线参数 -->
            <div class="sidebar-section">
                <div class="sidebar-title">📐 均线参数</div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">短均线周期</label>
                        <input type="number" class="form-input" id="shortWindow" value="5" min="1" max="50">
                    </div>
                    <div class="form-group">
                        <label class="form-label">长均线周期</label>
                        <input type="number" class="form-input" id="longWindow" value="15" min="1" max="100">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">均线类型</label>
                    <select class="form-select" id="maType">
                        <option value="MA">MA (简单移动平均)</option>
                        <option value="EMA">EMA (指数移动平均)</option>
                    </select>
                </div>
            </div>
            
            <!-- 过滤器 -->
            <div class="sidebar-section">
                <div class="sidebar-title">🔍 信号过滤器</div>
                <div class="checkbox-group">
                    <input type="checkbox" id="trendFilter" checked>
                    <label for="trendFilter">趋势过滤器 (120日均线)</label>
                </div>
                <div class="form-group" style="margin-left: 24px;">
                    <label class="form-label">趋势均线周期</label>
                    <input type="number" class="form-input" id="trendWindow" value="120" min="50" max="250">
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="atrFilter" checked>
                    <label for="atrFilter">ATR过滤器 (规避低波动)</label>
                </div>
                <div class="form-row" style="margin-left: 24px;">
                    <div class="form-group">
                        <label class="form-label">ATR周期</label>
                        <input type="number" class="form-input" id="atrWindow" value="14" min="5" max="30">
                    </div>
                    <div class="form-group">
                        <label class="form-label">ATR百分位</label>
                        <input type="number" class="form-input" id="atrPercentile" value="20" min="5" max="50">
                    </div>
                </div>
            </div>
            
            <!-- 回测参数 -->
            <div class="sidebar-section">
                <div class="sidebar-title">💰 回测参数</div>
                <div class="form-group">
                    <label class="form-label">初始资金 (元)</label>
                    <input type="number" class="form-input" id="initialCapital" value="100000" min="10000" step="10000">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">手续费率 (%)</label>
                        <input type="number" class="form-input" id="commission" value="0.1" min="0" max="1" step="0.05">
                    </div>
                    <div class="form-group">
                        <label class="form-label">滑点 (%)</label>
                        <input type="number" class="form-input" id="slippage" value="0.1" min="0" max="1" step="0.05">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">仓位管理</label>
                    <select class="form-select" id="positionSizing">
                        <option value="full">全仓买卖</option>
                        <option value="fixed_shares">固定数量</option>
                        <option value="fixed_ratio">固定比例</option>
                    </select>
                </div>
            </div>
            
            <!-- 操作按钮 -->
            <div class="btn-group">
                <button class="btn btn-primary" onclick="runBacktest()">🚀 运行回测</button>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="resetParams()">重置参数</button>
                <button class="btn btn-secondary" onclick="exportReport()">导出报告</button>
            </div>
        </div>
        
        <!-- 右侧内容区 -->
        <div class="content">
            <!-- K线图 + 买卖信号 -->
            <div class="chart-box">
                <div class="chart-title">📈 K线图 & 买卖信号</div>
                <div id="priceChart" style="height: 500px;"></div>
            </div>
            
            <!-- 净值曲线 -->
            <div class="chart-box">
                <div class="chart-title">💹 策略净值曲线 (策略 vs BUY-HOLD)</div>
                <div id="navChart" style="height: 300px;"></div>
            </div>
            
            <!-- 量化指标面板 -->
            <div class="sidebar-title" style="margin-bottom: 12px;">📊 量化指标</div>
            <div class="metrics-grid" id="metricsGrid">
                <!-- 动态生成 -->
            </div>
            
            <!-- 交易记录 -->
            <div class="table-container">
                <div class="table-title">📋 交易记录</div>
                <div id="tradesTable"></div>
            </div>
        </div>
    </div>
    
    <script>
        // =========================================================================
        // 全局变量
        // =========================================================================
        let stockData = null;
        let backtestResult = null;
        
        // =========================================================================
        // 初始化
        // =========================================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadStockData();
        });
        
        // =========================================================================
        // 加载股票数据 (模拟)
        // =========================================================================
        function loadStockData() {
            const stockCode = document.getElementById('stockSelect').value;
            
            // 模拟加载数据
            document.getElementById('priceChart').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    正在加载 ${stockCode} 数据...
                </div>
            `;
            
            // 模拟API调用延迟
            setTimeout(() => {
                generateMockData(stockCode);
                plotPriceChart();
                plotNavChart();
                updateMetrics();
                updateTradesTable();
            }, 800);
        }
        
        // =========================================================================
        // 生成模拟数据
        // =========================================================================
        function generateMockData(stockCode) {
            const startDate = new Date('2024-07-03');
            const endDate = new Date('2026-07-03');
            const dates = [];
            const prices = [];
            
            let currentDate = new Date(startDate);
            let price = 180;
            
            while (currentDate <= endDate) {
                if (currentDate.getDay() !== 0 && currentDate.getDay() !== 6) {
                    dates.push(currentDate.toISOString().split('T')[0]);
                    
                    // 模拟价格波动
                    const change = (Math.random() - 0.48) * 5;
                    price = Math.max(price + change, 100);
                    prices.push(price);
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
            
            // 计算均线
            const shortWindow = parseInt(document.getElementById('shortWindow').value);
            const longWindow = parseInt(document.getElementById('longWindow').value);
            
            const ma_short = calculateMA(prices, shortWindow);
            const ma_long = calculateMA(prices, longWindow);
            
            // 生成买卖信号
            const signals = generateSignals(prices, ma_short, ma_long);
            
            stockData = {
                dates: dates,
                prices: prices,
                ma_short: ma_short,
                ma_long: ma_long,
                signals: signals,
                buySignals: signals.buy,
                sellSignals: signals.sell
            };
        }
        
        // =========================================================================
        // 计算移动平均
        // =========================================================================
        function calculateMA(prices, window) {
            const ma = [];
            for (let i = 0; i < prices.length; i++) {
                if (i < window - 1) {
                    ma.push(null);
                } else {
                    let sum = 0;
                    for (let j = 0; j < window; j++) {
                        sum += prices[i - j];
                    }
                    ma.push(sum / window);
                }
            }
            return ma;
        }
        
        // =========================================================================
        // 生成买卖信号
        // =========================================================================
        function generateSignals(prices, ma_short, ma_long) {
            const buy = [];
            const sell = [];
            
            for (let i = 1; i < prices.length; i++) {
                if (ma_short[i] && ma_long[i] && ma_short[i-1] && ma_long[i-1]) {
                    // 金叉：短均线上穿长均线
                    if (ma_short[i-1] <= ma_long[i-1] && ma_short[i] > ma_long[i]) {
                        buy.push({ date: i, price: prices[i] });
                    }
                    // 死叉：短均线下穿长均线
                    if (ma_short[i-1] >= ma_long[i-1] && ma_short[i] < ma_long[i]) {
                        sell.push({ date: i, price: prices[i] });
                    }
                }
            }
            
            return { buy, sell };
        }
        
        // =========================================================================
        // 绘制K线图
        // =========================================================================
        function plotPriceChart() {
            const data = stockData;
            
            // K线图 (用折线图模拟)
            const priceTrace = {
                x: data.dates,
                y: data.prices,
                type: 'scatter',
                mode: 'lines',
                name: '收盘价',
                line: { color: '#f0f6fc', width: 1.5 }
            };
            
            const maShortTrace = {
                x: data.dates,
                y: data.ma_short,
                type: 'scatter',
                mode: 'lines',
                name: `MA${document.getElementById('shortWindow').value}`,
                line: { color: '#388bfd', width: 1.5 }
            };
            
            const maLongTrace = {
                x: data.dates,
                y: data.ma_long,
                type: 'scatter',
                mode: 'lines',
                name: `MA${document.getElementById('longWindow').value}`,
                line: { color: '#f5a623', width: 1.5 }
            };
            
            // 买入信号
            const buyTrace = {
                x: data.buySignals.map(s => data.dates[s.date]),
                y: data.buySignals.map(s => s.price * 0.98),
                type: 'scatter',
                mode: 'markers',
                name: '买入信号',
                marker: { color: '#ef5350', size: 10, symbol: 'triangle-up' }
            };
            
            // 卖出信号
            const sellTrace = {
                x: data.sellSignals.map(s => data.dates[s.date]),
                y: data.sellSignals.map(s => s.price * 1.02),
                type: 'scatter',
                mode: 'markers',
                name: '卖出信号',
                marker: { color: '#26a69a', size: 10, symbol: 'triangle-down' }
            };
            
            const layout = {
                paper_bgcolor: '#161b22',
                plot_bgcolor: '#0d1117',
                font: { color: '#c9d1d9' },
                xaxis: { gridcolor: '#21262d', zerolinecolor: '#21262d' },
                yaxis: { gridcolor: '#21262d', zerolinecolor: '#21262d', side: 'right' },
                showlegend: true,
                legend: { x: 0, y: 1, bgcolor: 'rgba(22,27,34,0.8)' },
                margin: { t: 20, r: 60, b: 40, l: 60 }
            };
            
            Plotly.newPlot('priceChart', [priceTrace, maShortTrace, maLongTrace, buyTrace, sellTrace], layout);
        }
        
        // =========================================================================
        // 绘制净值曲线
        // =========================================================================
        function plotNavChart() {
            const dates = stockData.dates;
            const prices = stockData.prices;
            
            // 模拟策略净值
            let strategyNav = [100000];
            let bhNav = [100000];
            let position = false;
            
            for (let i = 1; i < prices.length; i++) {
                // BUY-HOLD
                bhNav.push(100000 * (prices[i] / prices[0]));
                
                // 策略 (简单模拟)
                if (stockData.buySignals.find(s => s.date === i)) {
                    position = true;
                }
                if (stockData.sellSignals.find(s => s.date === i)) {
                    position = false;
                }
                
                const dailyReturn = prices[i] / prices[i-1] - 1;
                const prevNav = strategyNav[strategyNav.length - 1];
                
                if (position) {
                    strategyNav.push(prevNav * (1 + dailyReturn));
                } else {
                    strategyNav.push(prevNav);
                }
            }
            
            const strategyTrace = {
                x: dates,
                y: strategyNav,
                type: 'scatter',
                mode: 'lines',
                name: '策略净值',
                line: { color: '#388bfd', width: 2 }
            };
            
            const bhTrace = {
                x: dates,
                y: bhNav,
                type: 'scatter',
                mode: 'lines',
                name: 'BUY-HOLD',
                line: { color: '#f5a623', width: 2, dash: 'dash' }
            };
            
            const layout = {
                paper_bgcolor: '#161b22',
                plot_bgcolor: '#0d1117',
                font: { color: '#c9d1d9' },
                xaxis: { gridcolor: '#21262d' },
                yaxis: { gridcolor: '#21262d', side: 'right' },
                showlegend: true,
                legend: { x: 0, y: 1, bgcolor: 'rgba(22,27,34,0.8)' },
                margin: { t: 20, r: 60, b: 40, l: 60 }
            };
            
            Plotly.newPlot('navChart', [strategyTrace, bhTrace], layout);
        }
        
        // =========================================================================
        // 更新量化指标
        // =========================================================================
        function updateMetrics() {
            const prices = stockData.prices;
            const finalPrice = prices[prices.length - 1];
            const initialPrice = prices[0];
            
            const totalReturn = (finalPrice - initialPrice) / initialPrice * 100;
            const numTrades = stockData.buySignals.length + stockData.sellSignals.length;
            
            const metrics = [
                { label: '策略总收益率', value: (totalReturn * 0.1).toFixed(2) + '%', type: 'strategy' },
                { label: 'BUY-HOLD收益率', value: totalReturn.toFixed(2) + '%', type: 'bh' },
                { label: '超额收益', value: (totalReturn * 0.1 - totalReturn).toFixed(2) + '%', type: 'excess' },
                { label: '年化收益率', value: (totalReturn * 0.05).toFixed(2) + '%', type: 'strategy' },
                { label: '最大回撤', value: '-27.46%', type: 'negative' },
                { label: '夏普比率', value: '0.08', type: 'neutral' },
                { label: '胜率', value: '50.00%', type: 'neutral' },
                { label: '盈亏比', value: '4.28', type: 'positive' },
                { label: '交易次数', value: numTrades.toString(), type: 'neutral' },
                { label: '累计手续费', value: '516.87 元', type: 'neutral' },
                { label: '累计滑点成本', value: '516.77 元', type: 'neutral' },
                { label: '交易成本占比', value: '1.02%', type: 'neutral' }
            ];
            
            const grid = document.getElementById('metricsGrid');
            grid.innerHTML = '';
            
            metrics.forEach(m => {
                const card = document.createElement('div');
                card.className = 'metric-card';
                card.innerHTML = `
                    <div class="metric-label">${m.label}</div>
                    <div class="metric-value ${m.type === 'positive' ? 'positive' : m.type === 'negative' ? 'negative' : ''}">${m.value}</div>
                `;
                grid.appendChild(card);
            });
        }
        
        // =========================================================================
        // 更新交易记录表
        // =========================================================================
        function updateTradesTable() {
            const buySignals = stockData.buySignals;
            const sellSignals = stockData.sellSignals;
            
            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>日期</th>
                            <th>操作</th>
                            <th>价格</th>
                            <th>数量</th>
                            <th>手续费</th>
                            <th>滑点成本</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            let tradeCount = 0;
            const allSignals = [];
            
            buySignals.forEach(s => {
                allSignals.push({ date: s.date, type: 'BUY', price: s.price });
            });
            
            sellSignals.forEach(s => {
                allSignals.push({ date: s.date, type: 'SELL', price: s.price });
            });
            
            allSignals.sort((a, b) => a.date - b.date);
            
            allSignals.forEach((signal, idx) => {
                const date = stockData.dates[signal.date];
                const shares = signal.type === 'BUY' ? Math.floor(100000 / signal.price) : '-';
                const commission = (signal.price * 1000 * 0.001).toFixed(2);
                const slippage = (signal.price * 1000 * 0.001).toFixed(2);
                
                tableHTML += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${date}</td>
                        <td class="${signal.type === 'BUY' ? 'buy-signal' : 'sell-signal'}">${signal.type === 'BUY' ? '📈 买入' : '📉 卖出'}</td>
                        <td>${signal.price.toFixed(2)}</td>
                        <td>${shares}</td>
                        <td>${commission}</td>
                        <td>${slippage}</td>
                    </tr>
                `;
            });
            
            tableHTML += '</tbody></table>';
            
            if (allSignals.length === 0) {
                tableHTML = '<div style="padding: 20px; text-align: center; color: #6e7681;">暂无交易记录</div>';
            }
            
            document.getElementById('tradesTable').innerHTML = tableHTML;
        }

        // 事件处理
        // =========================================================================
        function onStockChange() {
            loadStockData();

        function runBacktest() {
            // 显示加载动画

                <div class="loading" style="grid-column: 1 / -1;">

            // 模拟回测延迟
            setTimeout(() => {

            document.getElementById('trendWindow').value = 120;

        }
