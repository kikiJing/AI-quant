<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quant Lab - 股票技术分析工具 v2.0</title>
    
    <!-- Lightweight Charts CDN -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            overflow-x: hidden;
        }
        
        /* 头部 */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px 40px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 24px;
            color: #58a6ff;
            font-weight: 600;
        }
        
        .header .subtitle {
            font-size: 14px;
            color: #8b949e;
            margin-top: 4px;
        }
        
        /* 主容器 */
        .container {
            display: flex;
            height: calc(100vh - 80px);
        }
        
        /* 左侧参数面板 */
        .sidebar {
            width: 280px;
            background: #161b22;
            border-right: 1px solid #30363d;
            padding: 20px;
            overflow-y: auto;
        }
        
        .sidebar h3 {
            font-size: 14px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #30363d;
        }
        
        .indicator-group {
            margin-bottom: 20px;
        }
        
        .indicator-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .indicator-checkbox {
            margin-right: 8px;
            cursor: pointer;
        }
        
        .indicator-label {
            font-size: 14px;
            font-weight: 500;
            color: #c9d1d9;
        }
        
        .param-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-left: 24px;
        }
        
        .param-label {
            font-size: 12px;
            color: #8b949e;
        }
        
        .param-input {
            width: 60px;
            padding: 4px 8px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-size: 12px;
            text-align: center;
        }
        
        .param-input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* 数据选择栏 */
        .data-bar {
            background: #161b22;
            padding: 15px 30px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .data-bar label {
            font-size: 13px;
            color: #8b949e;
        }
        
        .data-bar select {
            padding: 6px 12px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 13px;
            cursor: pointer;
        }
        
        .btn {
            padding: 8px 16px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn:hover {
            background: #2ea043;
        }
        
        .btn-secondary {
            background: #30363d;
        }
        
        .btn-secondary:hover {
            background: #484f58;
        }
        
        /* 图表容器 */
        .charts-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .chart-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .chart-title {
            padding: 12px 20px;
            background: #21262d;
            border-bottom: 1px solid #30363d;
            font-size: 14px;
            font-weight: 500;
            color: #c9d1d9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chart-wrapper {
            padding: 10px;
        }
        
        /* 统计面板 */
        .stats-panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .stats-panel h3 {
            font-size: 16px;
            color: #c9d1d9;
            margin-bottom: 15px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .stat-item {
            background: #21262d;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
        }
        
        .stat-label {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: #c9d1d9;
        }
        
        .stat-change {
            font-size: 12px;
            margin-top: 4px;
        }
        
        .positive {
            color: #f85149;
        }
        
        .negative {
            color: #3fb950;
        }
        
        /* 图表图例 */
        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 10px 20px;
            background: #21262d;
            border-top: 1px solid #30363d;
            font-size: 12px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .legend-color {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }
        
        .legend-line {
            width: 20px;
            height: 2px;
            border-radius: 1px;
        }
        
        .legend-label {
            color: #c9d1d9;
            font-size: 12px;
        }
        
        .legend-candlestick {
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #f85149 50%, #3fb950 50%);
            border-radius: 2px;
        }
        
        .legend-histogram {
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #f85149 50%, #3fb950 50%);
            border-radius: 2px;
            opacity: 0.5;
        }
        
        /* 信号面板样式 */
        #signalsPanel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .signal-item {
            background: #21262d;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #30363d;
            transition: all 0.3s;
        }
        
        .signal-item:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
        }
        
        .signal-buy {
            border-left: 4px solid #3fb950;
        }
        
        .signal-sell {
            border-left: 4px solid #f85149;
        }
        
        .signal-neutral {
            border-left: 4px solid #8b949e;
        }
        
        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .signal-indicator {
            font-size: 14px;
            font-weight: 600;
            color: #c9d1d9;
        }
        
        .signal-type {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .signal-type.buy {
            background: rgba(63, 185, 80, 0.2);
            color: #3fb950;
        }
        
        .signal-type.sell {
            background: rgba(248, 81, 73, 0.2);
            color: #f85149;
        }
        
        .signal-type.neutral {
            background: rgba(139, 148, 158, 0.2);
            color: #8b949e;
        }
        
        .signal-reason {
            font-size: 13px;
            color: #c9d1d9;
            margin-bottom: 8px;
        }
        
        .signal-strength {
            font-size: 11px;
            color: #8b949e;
        }
        
        .loading {
            color: #8b949e;
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                max-height: 300px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
            
            #signalsPanel {
                grid-template-columns: 1fr;
            }
            
            .chart-legend {
                gap: 10px;
                padding: 8px 15px;
            }
        }
        
        /* 加载提示 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
        
        /* 响应式 */
        @media (max-width: 1200px) {
            .sidebar {
                width: 240px;
            }
        }
    </style>
</head>
<body>

                    <option value="ningde_times_300750">宁德时代 (300750.SZ)</option>

        <!-- 主内容区 -->
        <div class="main-content">

                        <div class="loading">请选择股票并加载数据...</div>
                    </div>
                </div>
                
                <!-- 信号分析面板 -->
                <div class="stats-panel" id="signalsPanelContainer">
                    <h3>🎯 交易信号分析</h3>

    <script>
        // ============ 全局变量 ============
        let stockData = [];
        let charts = {};
        
        // ============ 数据加载 ============
        async function loadData() {
            const select = document.getElementById('stockSelect');
            const stockName = select.options[select.selectedIndex].text;
            const stockFile = select.value;
            
            document.getElementById('currentStock').textContent = stockName;
            
            try {
                // 构建CSV文件路径
                const csvPath = `data/${stockFile}_daily.csv`;
                console.log('正在加载:', csvPath);
                // 移除alert，改用console.log
                
                // 加载CSV数据
                const response = await fetch(csvPath + '?t=' + new Date().getTime()); // 添加时间戳防止缓存
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const csvText = await response.text();
                console.log('CSV数据长度:', csvText.length);
                
                // 移除可能的BOM字符
                const cleanCSV = csvText.replace(/^\uFEFF/, '');
                
                // 解析CSV
                const lines = cleanCSV.trim().split('\n');
                console.log('CSV行数:', lines.length);
                console.log('第一行原始内容:', lines[0]);
                
                if (lines.length < 2) {
                    throw new Error('CSV文件数据不足');
                }
                
                // 解析表头，建立列名到索引的映射
                const headers = lines[0].split(',').map(h => h.trim());
                console.log('CSV表头:', headers);
                // 移除alert，改用console.log
                
                // 建立列名映射
                const colIndex = {};
                headers.forEach((header, idx) => {
                    colIndex[header] = idx;
                });
                
                console.log('列名映射:', colIndex);
                
                // 验证必需的列是否存在（支持trade_date或date）
                const dateCol = colIndex['trade_date'] !== undefined ? 'trade_date' : (colIndex['date'] !== undefined ? 'date' : null);
                const volumeCol = colIndex['vol'] !== undefined ? 'vol' : (colIndex['volume'] !== undefined ? 'volume' : null);
                
                if (!dateCol) {
                    throw new Error(`CSV文件缺少日期列。找到的列: ${headers.join(', ')}`);
                }
                
                if (!volumeCol) {
                    throw new Error(`CSV文件缺少成交量列。找到的列: ${headers.join(', ')}`);
                }
                
                const requiredCols = [dateCol, 'open', 'high', 'low', 'close', volumeCol];
                const missingCols = requiredCols.filter(col => colIndex[col] === undefined);
                if (missingCols.length > 0) {
                    throw new Error(`CSV文件缺少必需的列: ${missingCols.join(', ')}\n\n找到的列: ${headers.join(', ')}`);
                }
                
                console.log('使用日期列:', dateCol);
                console.log('使用成交量列:', volumeCol);
                
                stockData = [];
                let skippedLines = 0;
                
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue; // 跳过空行
                    
                    const values = line.split(',');
                    
                    // 处理可能的引号
                    const cleanValue = (v) => v.replace(/^"|"$/g, '').trim();
                    
                    // 使用列名映射获取值，而不是硬编码索引
                    const date = cleanValue(values[colIndex[dateCol]]);
                    const open = parseFloat(cleanValue(values[colIndex['open']]));
                    const high = parseFloat(cleanValue(values[colIndex['high']]));
                    const low = parseFloat(cleanValue(values[colIndex['low']]));
                    const close = parseFloat(cleanValue(values[colIndex['close']]));
                    const volume = parseFloat(cleanValue(values[colIndex[volumeCol]]));
                    
                    // 验证数据
                    if (!date || isNaN(open) || isNaN(high) || isNaN(low) || isNaN(close) || isNaN(volume)) {
                        console.warn(`第${i+1}行数据无效，跳过:`, values);
                        skippedLines++;
                        continue;
                    }
                    
                    stockData.push({
                        date: date,
                        open: open,
                        high: high,
                        low: low,
                        close: close,
                        volume: volume
                    });
                }
                
                console.log(`解析完成: 成功${stockData.length}条，跳过${skippedLines}条`);
                
                if (stockData.length === 0) {
                    throw new Error('没有有效数据');
                }
                
                // 按日期正序排列
                stockData.sort((a, b) => a.date.localeCompare(b.date));
                
                console.log('第一条数据:', stockData[0]);
                console.log('最后一条数据:', stockData[stockData.length - 1]);
                
                // 更新数据期间
                const startDate = stockData[0].date;
                const endDate = stockData[stockData.length - 1].date;
                document.getElementById('dataRange').textContent = `${startDate} 至 ${endDate} (共${stockData.length}条)`;
                
                // 更新图表
                updateCharts();
                
                console.log('数据加载成功！');
                
            } catch (error) {

        // ============ 技术指标计算 ============
        
        // 计算MA
        // ============ MA计算（返回带时间的数据） ============
        function calculateMA(data, periods) {
            const result = {};
            periods.forEach(period => {
                result[period] = [];
                for (let i = period - 1; i < data.length; i++) {
                    let sum = 0;
                    for (let j = 0; j < period; j++) {
                        sum += data[i - j].close;
                    }
                    result[period].push({
                        time: data[i].date,
                        value: sum / period
                    });
                }
            });
            return result;
        }
        
        // 计算RSI
        // ============ RSI计算（返回带时间的数据） ============
        function calculateRSI(data, period) {
            const result = [];
            
            for (let i = period; i < data.length; i++) {
                let gains = 0, losses = 0;
                for (let j = 0; j < period; j++) {
                    const change = data[i - j].close - data[i - j - 1].close;
                    if (change > 0) gains += change;
                    else losses += Math.abs(change);
                }
                
                const avgGain = gains / period;
                const avgLoss = losses / period;
                const rs = avgGain / avgLoss;
                result.push({
                    time: data[i].date,
                    value: 100 - (100 / (1 + rs))
                });
            }
            
            return result;
        }
        
        // 计算MACD
        // ============ 新增：MACD计算（返回带时间的数据） ============
        function calculateMACD(data, fast, slow, signal) {
            // 计算EMA
            function ema(prices, period) {
                const result = [];
                const k = 2 / (period + 1);
                
                // 第一个EMA使用SMA
                let sum = 0;
                for (let i = 0; i < period; i++) {
                    sum += prices[i];
                }
                result[period - 1] = sum / period;
                
                // 后续使用EMA公式
                for (let i = period; i < prices.length; i++) {
                    result[i] = prices[i] * k + result[i - 1] * (1 - k);
                }
                
                return result;
            }
            
            const closes = data.map(d => d.close);
            const emaFast = ema(closes, fast);
            const emaSlow = ema(closes, slow);
            
            // 计算DIF（从slow-1开始有有效值）
            const dif = [];
            for (let i = slow - 1; i < data.length; i++) {
                dif.push({
                    time: data[i].date,
                    value: emaFast[i] - emaSlow[i]
                });
            }
            
            // 计算DEA（对DIF做EMA）
            const difValues = dif.map(d => d.value);
            const deaValues = ema(difValues, signal);
            
            const dea = [];
            for (let i = signal - 1; i < difValues.length; i++) {
                dea.push({
                    time: dif[i].time,
                    value: deaValues[i]
                });
            }
            
            // 计算MACD柱
            const macd = [];
            for (let i = 0; i < dea.length; i++) {
                macd.push({
                    time: dea[i].time,
                    value: (dif[i + signal - 1].value - dea[i].value) * 2
                });
            }
            
            return { dif, dea, macd };
        }
        
        // ============ 布林带计算（返回带时间的数据） ============
        function calculateBollingerBands(data, period, stdDev) {
            const middle = [];
            const upper = [];
            const lower = [];
            
            for (let i = period - 1; i < data.length; i++) {
                // 计算移动平均
                let sum = 0;
                for (let j = 0; j < period; j++) {
                    sum += data[i - j].close;
                }
                const ma = sum / period;
                
                // 计算标准差
                let variance = 0;
                for (let j = 0; j < period; j++) {
                    variance += Math.pow(data[i - j].close - ma, 2);
                }
                const std = Math.sqrt(variance / period);
                
                middle.push({
                    time: data[i].date,
                    value: ma
                });
                
                upper.push({
                    time: data[i].date,
                    value: ma + stdDev * std
                });
                
                lower.push({
                    time: data[i].date,
                    value: ma - stdDev * std
                });
            }
            
            return { middle, upper, lower };
        }
        
        // ============ 新增：DMI/ADX计算 ============
        // ============ DMI/ADX计算（返回带时间的数据） ============
        function calculateDMIADX(data, period) {
            const tr = []; // True Range
            const plusDM = []; // +DM
            const minusDM = []; // -DM
            
            // 计算TR, +DM, -DM
            for (let i = 0; i < data.length; i++) {
                if (i === 0) {
                    tr.push(data[i].high - data[i].low);
                    plusDM.push(0);
                    minusDM.push(0);
                } else {
                    const high = data[i].high;
                    const low = data[i].low;
                    const prevHigh = data[i - 1].high;
                    const prevLow = data[i - 1].low;
                    const prevClose = data[i - 1].close;
                    
                    // TR = max(High - Low, |High - PrevClose|, |Low - PrevClose|)
                    const tr1 = high - low;
                    const tr2 = Math.abs(high - prevClose);
                    const tr3 = Math.abs(low - prevClose);
                    tr.push(Math.max(tr1, tr2, tr3));
                    
                    // +DM = Current High - Previous High (if > 0 and > -DM)
                    const dmPlus = high - prevHigh;
                    const dmMinus = prevLow - low;
                    
                    plusDM.push(dmPlus > 0 && dmPlus > dmMinus ? dmPlus : 0);
                    minusDM.push(dmMinus > 0 && dmMinus > dmPlus ? dmMinus : 0);
                }
            }
            
            // 计算平滑TR和DM（使用Wilder's smoothing）
            const smoothedTR = wilderSmoothing(tr, period);
            const smoothedPlusDM = wilderSmoothing(plusDM, period);
            const smoothedMinusDM = wilderSmoothing(minusDM, period);
            
            // 计算+DI和-DI（从period-1开始有有效值）
            const plusDI = [];
            const minusDI = [];
            
            for (let i = period - 1; i < data.length; i++) {
                const pdi = (smoothedPlusDM[i] / smoothedTR[i]) * 100;
                const mdi = (smoothedMinusDM[i] / smoothedTR[i]) * 100;
                
                plusDI.push({
                    time: data[i].date,
                    value: pdi
                });
                
                minusDI.push({
                    time: data[i].date,
                    value: mdi
                });
            }
            
            // 计算DX
            const dx = plusDI.map((p, idx) => ({
                time: p.time,
                value: (p.value + minusDI[idx].value) === 0 ? 0 : Math.abs((p.value - minusDI[idx].value) / (p.value + minusDI[idx].value)) * 100
            }));
            
            // 计算ADX（DX的Wilder平滑）
            const dxValues = dx.map(d => d.value);
            const adxValues = wilderSmoothing(dxValues, period);
            
            const adx = [];
            for (let i = period - 1; i < dx.length; i++) {
                adx.push({
                    time: dx[i].time,
                    value: adxValues[i]
                });
            }
            
            return { plusDI, minusDI, adx };
        }
        
        // Wilder's Smoothing
        function wilderSmoothing(values, period) {
            const result = [];
            let sum = 0;
            
            for (let i = 0; i < values.length; i++) {
                if (i < period) {
                    sum += values[i];
                    if (i === period - 1) {
                        result[i] = sum;
                    } else {
                        result.push(null);
                    }
                } else {
                    result[i] = result[i - 1] - (result[i - 1] / period) + values[i];
                }
            }
            
            return result;
        }
        
        // ============ 新增：KDJ计算 ============
        // ============ KDJ计算（返回带时间的数据） ============
        function calculateKDJ(data, rsvPeriod, kPeriod, dPeriod) {
            const k = [];
            const d = [];
            const j = [];
            
            let prevK = 50; // 初始K值
            let prevD = 50; // 初始D值
            
            for (let i = rsvPeriod - 1; i < data.length; i++) {
                // 计算RSV
                let lowest = data[i].low;
                let highest = data[i].high;
                
                for (let jj = 0; jj < rsvPeriod; jj++) {
                    lowest = Math.min(lowest, data[i - jj].low);
                    highest = Math.max(highest, data[i - jj].high);
                }
                
                const rsv = highest === lowest ? 50 : ((data[i].close - lowest) / (highest - lowest)) * 100;
                
                // 计算K值
                const kValue = (kPeriod - 1) / kPeriod * prevK + (1 / kPeriod) * rsv;
                
                // 计算D值
                const dValue = (dPeriod - 1) / dPeriod * prevD + (1 / dPeriod) * kValue;
                
                // 计算J值
                const jValue = 3 * kValue - 2 * dValue;
                
                k.push({
                    time: data[i].date,
                    value: kValue
                });
                
                d.push({
                    time: data[i].date,
                    value: dValue
                });
                
                j.push({
                    time: data[i].date,
                    value: jValue
                });
                
                prevK = kValue;
                prevD = dValue;
            }
            
            return { k, d, j };
        }
        
        // ============ VWAP计算（返回带时间的数据） ============
        function calculateVWAP(data) {
            const vwap = [];
            let cumulativeVolumePrice = 0;
            let cumulativeVolume = 0;
            
            for (let i = 0; i < data.length; i++) {
                // VWAP = ∑(典型价格 × 成交量) / ∑成交量
                // 典型价格 = (High + Low + Close) / 3
                const typicalPrice = (data[i].high + data[i].low + data[i].close) / 3;
                cumulativeVolumePrice += typicalPrice * data[i].volume;
                cumulativeVolume += data[i].volume;
                
                vwap.push({
                    time: data[i].date,
                    value: cumulativeVolumePrice / cumulativeVolume
                });
            }
            
            return vwap;
        }

                // 在K线图上添加VWAP线
                const chart = charts.main;
                if (!chart) {
                    console.error('主图表不存在');
                    return;
                }
                
                const vwapSeries = chart.addLineSeries({
                    color: '#d2a8ff',
                    lineWidth: 2,
                    priceLineVisible: false,
                    lastValueVisible: true,
                });
                
                vwapSeries.setData(vwap);
                
                console.log('VWAP创建成功！');
                
            } catch (error) {
                console.error('创建VWAP失败:', error);
            }
        }
        
        // ============ 更新统计信息 ============
        
        function updateStats() {
            const closes = stockData.map(d => d.close);
            const volumes = stockData.map(d => d.volume);
            
            const latestClose = closes[closes.length - 1];
            const prevClose = closes[closes.length - 2];
            const change = latestClose - prevClose;
            const changePercent = (change / prevClose * 100).toFixed(2);
            
            const mean = closes.reduce((a, b) => a + b) / closes.length;
            const max = Math.max(...closes);
            const min = Math.min(...closes);
            
            const statsHTML = `
                <div class="stat-item">
                    <div class="stat-label">最新收盘价</div>
                    <div class="stat-value">${latestClose.toFixed(2)}</div>
                    <div class="stat-change ${change >= 0 ? 'positive' : 'negative'}">
                        ${change >= 0 ? '+' : ''}${change.toFixed(2)} (${changePercent}%)
                    </div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">平均价</div>
                    <div class="stat-value">${mean.toFixed(2)}</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">最高价</div>
                    <div class="stat-value">${max.toFixed(2)}</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">最低价</div>
                    <div class="stat-value">${min.toFixed(2)}</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">平均成交量</div>
                    <div class="stat-value">${(volumes.reduce((a, b) => a + b) / volumes.length).toFixed(0)}</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">数据点数</div>
                    <div class="stat-value">${stockData.length}</div>
                </div>
            `;
            
            document.getElementById('statsGrid').innerHTML = statsHTML;
        }
        
        // ============ 信号分析 ============
        
        function analyzeSignals() {
            if (stockData.length === 0) return;
            
            const signals = [];
            
            // 1. RSI信号
            const rsiPeriod = parseInt(document.getElementById('rsiPeriod').value);
            const rsiData = calculateRSI(stockData, rsiPeriod);
            if (rsiData.length > 0) {
                const latestRSI = rsiData[rsiData.length - 1].value;
                if (latestRSI < 30) {
                    signals.push({ indicator: 'RSI', signal: '买入', reason: `RSI=${latestRSI.toFixed(2)} < 30 (超卖)`, strength: '强' });
                } else if (latestRSI > 70) {
                    signals.push({ indicator: 'RSI', signal: '卖出', reason: `RSI=${latestRSI.toFixed(2)} > 70 (超买)`, strength: '强' });
                } else {
                    signals.push({ indicator: 'RSI', signal: '中性', reason: `RSI=${latestRSI.toFixed(2)}`, strength: '弱' });
                }
            }
            
            // 2. MACD信号
            const macdParams = document.getElementById('macdParams').value.split(',').map(p => parseInt(p.trim()));
            const macdResult = calculateMACD(stockData, macdParams[0], macdParams[1], macdParams[2]);
            if (macdResult.dif.length >= 2 && macdResult.dea.length >= 2) {
                const difLatest = macdResult.dif[macdResult.dif.length - 1].value;
                const deaLatest = macdResult.dea[macdResult.dea.length - 1].value;
                const difPrev = macdResult.dif[macdResult.dif.length - 2].value;
                const deaPrev = macdResult.dea[macdResult.dea.length - 2].value;
                
                if (difPrev < deaPrev && difLatest > deaLatest) {
                    signals.push({ indicator: 'MACD', signal: '买入', reason: 'DIF上穿DEA (金叉)', strength: '强' });
                } else if (difPrev > deaPrev && difLatest < deaLatest) {
                    signals.push({ indicator: 'MACD', signal: '卖出', reason: 'DIF下穿DEA (死叉)', strength: '强' });
                } else if (difLatest > deaLatest) {
                    signals.push({ indicator: 'MACD', signal: '中性偏多', reason: 'DIF > DEA', strength: '中' });
                } else {
                    signals.push({ indicator: 'MACD', signal: '中性偏空', reason: 'DIF < DEA', strength: '中' });
                }
            }
            
            // 3. 布林带信号
            const bollingerPeriod = parseInt(document.getElementById('bollingerPeriod').value);
            const bollingerStdDev = parseFloat(document.getElementById('bollingerStdDev').value);
            const bb = calculateBollingerBands(stockData, bollingerPeriod, bollingerStdDev);
            if (bb.upper.length > 0 && bb.lower.length > 0) {
                const latestClose = stockData[stockData.length - 1].close;
                const latestUpper = bb.upper[bb.upper.length - 1].value;
                const latestLower = bb.lower[bb.lower.length - 1].value;
                const latestMiddle = bb.middle[bb.middle.length - 1].value;
                
                if (latestClose <= latestLower) {
                    signals.push({ indicator: '布林带', signal: '买入', reason: '价格触及下轨', strength: '中' });
                } else if (latestClose >= latestUpper) {
                    signals.push({ indicator: '布林带', signal: '卖出', reason: '价格触及上轨', strength: '中' });
                } else if (latestClose < latestMiddle) {
                    signals.push({ indicator: '布林带', signal: '中性偏多', reason: '价格在下轨与中轨之间', strength: '弱' });
                } else {
                    signals.push({ indicator: '布林带', signal: '中性偏空', reason: '价格在上轨与中轨之间', strength: '弱' });
                }
            }
            
            // 4. KDJ信号
            const kdjRsvPeriod = parseInt(document.getElementById('kdjRsvPeriod').value);
            const kdjKPeriod = parseInt(document.getElementById('kdjKPeriod').value);
            const kdjDPeriod = parseInt(document.getElementById('kdjDPeriod').value);
            const kdjResult = calculateKDJ(stockData, kdjRsvPeriod, kdjKPeriod, kdjDPeriod);
            if (kdjResult.k.length >= 2 && kdjResult.d.length >= 2) {
                const kLatest = kdjResult.k[kdjResult.k.length - 1].value;
                const dLatest = kdjResult.d[kdjResult.d.length - 1].value;
                const kPrev = kdjResult.k[kdjResult.k.length - 2].value;
                const dPrev = kdjResult.d[kdjResult.d.length - 2].value;
                
                if (kPrev < dPrev && kLatest > dLatest) {
                    signals.push({ indicator: 'KDJ', signal: '买入', reason: 'K线上穿D线 (金叉)', strength: '强' });
                } else if (kPrev > dPrev && kLatest < dLatest) {
                    signals.push({ indicator: 'KDJ', signal: '卖出', reason: 'K线下穿D线 (死叉)', strength: '强' });
                } else if (kLatest > dLatest) {
                    signals.push({ indicator: 'KDJ', signal: '中性偏多', reason: 'K > D', strength: '中' });
                } else {
                    signals.push({ indicator: 'KDJ', signal: '中性偏空', reason: 'K < D', strength: '中' });
                }
            }
            
            // 5. DMI信号
            const dmiPeriod = parseInt(document.getElementById('dmiPeriod').value);
            const dmiResult = calculateDMIADX(stockData, dmiPeriod);
            if (dmiResult.plusDI.length >= 2 && dmiResult.minusDI.length >= 2) {
                const plusDILatest = dmiResult.plusDI[dmiResult.plusDI.length - 1].value;
                const minusDILatest = dmiResult.minusDI[dmiResult.minusDI.length - 1].value;
                const plusDIPrev = dmiResult.plusDI[dmiResult.plusDI.length - 2].value;
                const minusDIPrev = dmiResult.minusDI[dmiResult.minusDI.length - 2].value;
                
                if (plusDIPrev < minusDIPrev && plusDILatest > minusDILatest) {
                    signals.push({ indicator: 'DMI', signal: '买入', reason: '+DI上穿-DI', strength: '强' });
                } else if (plusDIPrev > minusDIPrev && plusDILatest < minusDILatest) {
                    signals.push({ indicator: 'DMI', signal: '卖出', reason: '-DI上穿+DI', strength: '强' });
                } else if (plusDILatest > minusDILatest) {
                    signals.push({ indicator: 'DMI', signal: '中性偏多', reason: '+DI > -DI', strength: '中' });
                } else {
                    signals.push({ indicator: 'DMI', signal: '中性偏空', reason: '+DI < -DI', strength: '中' });
                }
            }
            
            // 6. MA信号
            const maPeriods = document.getElementById('maPeriods').value.split(',').map(p => parseInt(p.trim())).filter(p => !isNaN(p));
            const maData = calculateMA(stockData, maPeriods);
            const latestClose = stockData[stockData.length - 1].close;
            
            maPeriods.forEach(period => {
                if (maData[period] && maData[period].length > 0) {
                    const latestMA = maData[period][maData[period].length - 1].value;
                    if (latestClose > latestMA) {
                        signals.push({ indicator: `MA${period}`, signal: '买入', reason: `价格 > MA${period}`, strength: '弱' });
                    } else {
                        signals.push({ indicator: `MA${period}`, signal: '卖出', reason: `价格 < MA${period}`, strength: '弱' });
                    }
                }
            });
            
            // 渲染信号面板
            renderSignals(signals);
        }
        
        function renderSignals(signals) {
            const signalsHTML = signals.map(s => `
                <div class="signal-item ${s.signal === '买入' ? 'signal-buy' : (s.signal === '卖出' ? 'signal-sell' : 'signal-neutral')}">
                    <div class="signal-header">
                        <span class="signal-indicator">${s.indicator}</span>
                        <span class="signal-type ${s.signal === '买入' ? 'buy' : (s.signal === '卖出' ? 'sell' : 'neutral')}">${s.signal}</span>
                    </div>
                    <div class="signal-reason">${s.reason}</div>
                    <div class="signal-strength">强度: ${s.strength}</div>
                </div>
            `).join('');
            
            const signalsPanel = document.getElementById('signalsPanel');
            if (signalsPanel) {
                signalsPanel.innerHTML = signalsHTML;
            }
        }
        
        // ============ 图例更新函数 ============
        
        function updateChartLegend(legendId, items) {
            const legendDiv = document.getElementById(legendId);
            if (!legendDiv) return;
            
            const legendHTML = items.map(item => `
                <div class="legend-item">
                    <div class="legend-color" style="background: ${item.color}; ${item.style || ''}"></div>
                    <span class="legend-label">${item.label}</span>
                </div>
            `).join('');
            
            legendDiv.innerHTML = legendHTML;
        }
        
        // ============ 主更新函数 ============
        
        function updateCharts() {
            if (stockData.length === 0) {
                alert('请先加载数据！');
                return;
            }
            
            // 清除旧图表
            Object.values(charts).forEach(chart => chart.remove());
            charts = {};
            
            // 创建新图表
            createCandlestickChart();
            
            // 在主图表上添加布林带和VWAP（必须在K线图创建后）
            if (document.getElementById('showBollinger').checked) {
                createBollingerBands();
            }
            if (document.getElementById('showVWAP').checked) {
                createVWAP();
            }
            
            // 创建独立指标图表
            createRSIChart();
            createMACDChart();
            createDMIADXChart();
            createKDJChart();
            
            // 更新统计和信号分析
            updateStats();
            analyzeSignals();
            
            // 更新所有图例
            updateAllLegends();
        }
        
        // ============ 更新所有图例 ============
        
        function updateAllLegends() {
            // 1. 主图表图例（K线图）
            const mainLegendItems = [
                { color: '#f85149', label: '阳线 (上涨)', style: 'height: 12px; border-radius: 2px;' },
                { color: '#3fb950', label: '阴线 (下跌)', style: 'height: 12px; border-radius: 2px;' },
                { color: 'rgba(248,81,73,0.5)', label: '成交量 (上涨)', style: 'height: 12px; border-radius: 2px;' },
                { color: 'rgba(63,185,80,0.5)', label: '成交量 (下跌)', style: 'height: 12px; border-radius: 2px;' }
            ];
            
            // 添加MA线图例
            if (document.getElementById('showMA').checked) {
                const periods = document.getElementById('maPeriods').value.split(',').map(p => parseInt(p.trim()));
                const colors = ['#f85149', '#58a6ff', '#3fb950', '#d2a8ff'];
                periods.forEach((period, idx) => {
                    mainLegendItems.push({
                        color: colors[idx % colors.length],
                        label: `MA${period}`
                    });
                });
            }
            
            // 添加布林带图例
            if (document.getElementById('showBollinger').checked) {
                mainLegendItems.push(
                    { color: '#58a6ff', label: '布林带中轨 (MA)' },
                    { color: '#f85149', label: '布林带上轨', style: 'border-top: 2px dashed;' },
                    { color: '#3fb950', label: '布林带下轨', style: 'border-top: 2px dashed;' }
                );
            }
            
            // 添加VWAP图例
            if (document.getElementById('showVWAP').checked) {
                mainLegendItems.push({
                    color: '#d2a8ff',
                    label: 'VWAP (成交量加权平均价)',
                    style: 'border-top: 2px solid;'
                });
            }
            
            updateChartLegend('mainChartLegend', mainLegendItems);
            
            // 2. RSI图表图例
            if (document.getElementById('showRSI').checked) {
                const rsiLegendItems = [
                    { color: '#58a6ff', label: 'RSI线' },
                    { color: '#f85149', label: '超买线 (70)', style: 'border-top: 2px dashed;' },
                    { color: '#3fb950', label: '超卖线 (30)', style: 'border-top: 2px dashed;' }
                ];
                updateChartLegend('rsiChartLegend', rsiLegendItems);
            }
            
            // 3. MACD图表图例
            if (document.getElementById('showMACD').checked) {
                const macdLegendItems = [
                    { color: '#58a6ff', label: 'DIF线' },
                    { color: '#f85149', label: 'DEA线' },
                    { color: '#3fb950', label: 'MACD柱 (正值)', style: 'height: 12px; border-radius: 2px;' },
                    { color: '#f85149', label: 'MACD柱 (负值)', style: 'height: 12px; border-radius: 2px;' }
                ];
                updateChartLegend('macdChartLegend', macdLegendItems);
            }
            
            // 4. DMI图表图例
            if (document.getElementById('showDMI').checked) {
                const dmiLegendItems = [
                    { color: '#58a6ff', label: '+DI (多头力道)' },
                    { color: '#f85149', label: '-DI (空头力道)' },
                    { color: '#d2a8ff', label: 'ADX (趋势强度)' },
                    { color: '#8b949e', label: '参考线 (25)', style: 'border-top: 2px dashed;' }
                ];
                updateChartLegend('dmiChartLegend', dmiLegendItems);
            }
            
            // 5. KDJ图表图例
            if (document.getElementById('showKDJ').checked) {
                const kdjLegendItems = [
                    { color: '#58a6ff', label: 'K线 (快线)' },
                    { color: '#f85149', label: 'D线 (慢线)' },
                    { color: '#3fb950', label: 'J线 (信号线)' },
                    { color: '#8b949e', label: '超买线 (80)', style: 'border-top: 2px dashed;' },
                    { color: '#8b949e', label: '超卖线 (20)', style: 'border-top: 2px dashed;' }
                ];
                updateChartLegend('kdjChartLegend', kdjLegendItems);
            }
        }
        
        // ============ 工具函数 ============
        
        function resetParams() {
            document.getElementById('maPeriods').value = '5,10,20,60';
            document.getElementById('rsiPeriod').value = '14';
            document.getElementById('macdParams').value = '12,26,9';
            document.getElementById('bollingerPeriod').value = '20';
            document.getElementById('bollingerStdDev').value = '2';
            document.getElementById('dmiPeriod').value = '14';
            document.getElementById('kdjRsvPeriod').value = '9';
            document.getElementById('kdjKPeriod').value = '3';
            document.getElementById('kdjDPeriod').value = '3';
            
            if (stockData.length > 0) {
                updateCharts();
            }
        }
        
        // ============ 初始化 ============
        
        window.addEventListener('load', () => {
            console.log('页面加载完成，开始加载数据...');
            // 延迟1秒加载，确保Lightweight Charts库已加载
            setTimeout(() => {
                loadData();
            }, 1000);
        });
        
        // 响应窗口大小变化
        window.addEventListener('resize', () => {
            if (stockData.length > 0) {
                updateCharts();
            }
        });
    </script>
