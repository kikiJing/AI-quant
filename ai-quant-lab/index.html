    <script>
        // ============ 全局变量 ============
        let stockData = [];
        let charts = {};
        
        // ============ 数据加载 ============
        async function loadData() {
            const select = document.getElementById('stockSelect');
            const stockName = select.options[select.selectedIndex].text;
            const stockFile = select.value;
            
            document.getElementById('currentStock').textContent = stockName;
            
            try {
                // 构建CSV文件路径
                const csvPath = `data/${stockFile}_daily.csv`;
                console.log('正在加载:', csvPath);
                
                // 加载CSV数据
                const response = await fetch(csvPath);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const csvText = await response.text();
                console.log('CSV数据长度:', csvText.length);
                
                // 移除可能的BOM字符
                const cleanCSV = csvText.replace(/^\uFEFF/, '');
                
                // 解析CSV
                const lines = cleanCSV.trim().split('\n');
                console.log('CSV行数:', lines.length);
                
                if (lines.length < 2) {
                    throw new Error('CSV文件数据不足');
                }
                
                // 解析表头，建立列名到索引的映射
                const headers = lines[0].split(',').map(h => h.trim());
                console.log('CSV表头:', headers);
                
                // 建立列名映射
                const colIndex = {};
                headers.forEach((header, idx) => {
                    colIndex[header] = idx;
                });
                
                console.log('列名映射:', colIndex);
                
                // 验证必需的列是否存在
                const requiredCols = ['trade_date', 'open', 'high', 'low', 'close', 'vol'];
                const missingCols = requiredCols.filter(col => colIndex[col] === undefined);
                if (missingCols.length > 0) {
                    throw new Error(`CSV文件缺少必需的列: ${missingCols.join(', ')}`);
                }
                
                stockData = [];
                
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue; // 跳过空行
                    
                    const values = line.split(',');
                    
                    // 处理可能的引号
                    const cleanValue = (v) => v.replace(/^"|"$/g, '').trim();
                    
                    // 使用列名映射获取值，而不是硬编码索引
                    const date = cleanValue(values[colIndex['trade_date']]);
                    const open = parseFloat(cleanValue(values[colIndex['open']]));
                    const high = parseFloat(cleanValue(values[colIndex['high']]));
                    const low = parseFloat(cleanValue(values[colIndex['low']]));
                    const close = parseFloat(cleanValue(values[colIndex['close']]));
                    const volume = parseFloat(cleanValue(values[colIndex['vol']]));
                    
                    // 验证数据
                    if (!date || isNaN(open) || isNaN(high) || isNaN(low) || isNaN(close) || isNaN(volume)) {
                        console.warn(`第${i+1}行数据无效，跳过:`, values);
                        continue;
                    }
                    
                    stockData.push({
                        date: date,
                        open: open,
                        high: high,
                        low: low,
                        close: close,
                        volume: volume
                    });
                }
                
                console.log('解析后的数据条数:', stockData.length);
                
                if (stockData.length === 0) {
                    throw new Error('没有有效数据');
                }
                
                // 按日期正序排列
                stockData.sort((a, b) => a.date.localeCompare(b.date));
                
                console.log('第一条数据:', stockData[0]);
                console.log('最后一条数据:', stockData[stockData.length - 1]);
                
                // 更新数据期间
                const startDate = stockData[0].date;
                const endDate = stockData[stockData.length - 1].date;
                document.getElementById('dataRange').textContent = `${startDate} 至 ${endDate} (共${stockData.length}条)`;
                
                // 更新图表
                updateCharts();
                
                console.log('数据加载成功！');
                
            } catch (error) {
                console.error('加载数据失败:', error);
                alert(`加载数据失败！\n\n错误: ${error.message}\n\n请检查：\n1. 浏览器是否通过 http://localhost:8000 访问（不要直接双击打开HTML）\n2. data/ 目录下是否存在 ${stockFile}_daily.csv 文件\n3. 打开浏览器控制台（F12）查看详细错误`);
            }
        }
        
        // ============ 技术指标计算 ============
        
        // 计算MA
        function calculateMA(data, periods) {
            const result = {};
            periods.forEach(period => {
                result[period] = [];
                for (let i = 0; i < data.length; i++) {
                    if (i < period - 1) {
                        result[period].push(null);
                    } else {
                        let sum = 0;
                        for (let j = 0; j < period; j++) {
                            sum += data[i - j].close;
                        }
                        result[period].push(sum / period);
                    }
                }
            });
            return result;
        }
        
        // 计算RSI
        function calculateRSI(data, period) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period) {
                    result.push(null);
                    continue;
                }
                
                let gains = 0, losses = 0;
                for (let j = 0; j < period; j++) {
                    const change = data[i - j].close - data[i - j - 1].close;
                    if (change > 0) gains += change;
                    else losses += Math.abs(change);
                }
                
                const avgGain = gains / period;
                const avgLoss = losses / period;
                const rs = avgGain / avgLoss;
                result.push(100 - (100 / (1 + rs)));
            }
            return result;
        }
        
        // 计算MACD
        function calculateMACD(data, fast, slow, signal) {
            // 计算EMA
            function ema(prices, period) {
                const result = [];
                const k = 2 / (period + 1);
                
                // 第一个EMA使用SMA
                let sum = 0;
                for (let i = 0; i < period; i++) {
                    sum += prices[i];
                }
                result[period - 1] = sum / period;
                
                // 后续使用EMA公式
                for (let i = period; i < prices.length; i++) {
                    result[i] = prices[i] * k + result[i - 1] * (1 - k);
                }
                
                return result;
            }
            
            const closes = data.map(d => d.close);
            const emaFast = ema(closes, fast);
            const emaSlow = ema(closes, slow);
            
            const dif = emaFast.map((val, idx) => val - emaSlow[idx]);
            const dea = ema(dif.filter(d => d !== undefined), signal);
            
            // 对齐数组
            const macd = [];
            let deaIdx = 0;
            for (let i = 0; i < data.length; i++) {
                if (i < slow + signal - 2) {
                    macd.push(null);
                } else {
                    macd.push((dif[i] - dea[deaIdx]) * 2);
                    deaIdx++;
                }
            }
            
            return {
                dif: dif,
                dea: dea,
                macd: macd
            };
        }
        
        // ============ 新增：布林带计算 ============
        function calculateBollingerBands(data, period, stdDev) {
            const middle = [];
            const upper = [];
            const lower = [];
            
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    middle.push(null);
                    upper.push(null);
                    lower.push(null);
                } else {
                    // 计算移动平均
                    let sum = 0;
                    for (let j = 0; j < period; j++) {
                        sum += data[i - j].close;
                    }
                    const ma = sum / period;
                    middle.push(ma);
                    
                    // 计算标准差
                    let variance = 0;
                    for (let j = 0; j < period; j++) {
                        variance += Math.pow(data[i - j].close - ma, 2);
                    }
                    const std = Math.sqrt(variance / period);
                    
                    upper.push(ma + stdDev * std);
                    lower.push(ma - stdDev * std);
                }
            }
            
            return { middle, upper, lower };
        }
        
        // ============ 新增：DMI/ADX计算 ============
        function calculateDMIADX(data, period) {
            const tr = []; // True Range
            const plusDM = []; // +DM
            const minusDM = []; // -DM
            
            // 计算TR, +DM, -DM
            for (let i = 0; i < data.length; i++) {
                if (i === 0) {
                    tr.push(data[i].high - data[i].low);
                    plusDM.push(0);
                    minusDM.push(0);
                } else {
                    const high = data[i].high;
                    const low = data[i].low;
                    const prevHigh = data[i - 1].high;
                    const prevLow = data[i - 1].low;
                    const prevClose = data[i - 1].close;
                    
                    // TR = max(High - Low, |High - PrevClose|, |Low - PrevClose|)
                    const tr1 = high - low;
                    const tr2 = Math.abs(high - prevClose);
                    const tr3 = Math.abs(low - prevClose);
                    tr.push(Math.max(tr1, tr2, tr3));
                    
                    // +DM = Current High - Previous High (if > 0 and > -DM)
                    const dmPlus = high - prevHigh;
                    const dmMinus = prevLow - low;
                    
                    plusDM.push(dmPlus > 0 && dmPlus > dmMinus ? dmPlus : 0);
                    minusDM.push(dmMinus > 0 && dmMinus > dmPlus ? dmMinus : 0);
                }
            }
            
            // 计算平滑TR和DM（使用Wilder's smoothing）
            const smoothedTR = wilderSmoothing(tr, period);
            const smoothedPlusDM = wilderSmoothing(plusDM, period);
            const smoothedMinusDM = wilderSmoothing(minusDM, period);
            
            // 计算+DI和-DI
            const plusDI = [];
            const minusDI = [];
            const dx = [];
            
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    plusDI.push(null);
                    minusDI.push(null);
                    dx.push(null);
                } else {
                    const pdi = (smoothedPlusDM[i] / smoothedTR[i]) * 100;
                    const mdi = (smoothedMinusDM[i] / smoothedTR[i]) * 100;
                    plusDI.push(pdi);
                    minusDI.push(mdi);
                    
                    const adx = (pdi + mdi) === 0 ? 0 : Math.abs((pdi - mdi) / (pdi + mdi)) * 100;
                    dx.push(adx);
                }
            }
            
            // 计算ADX（DX的平滑平均）
            const adx = wilderSmoothing(dx.filter(d => d !== null), period);
            
            // 对齐ADX数组
            const adxResult = [];
            let adxIdx = 0;
            for (let i = 0; i < data.length; i++) {
                if (i < 2 * period - 2) {
                    adxResult.push(null);
                } else {
                    adxResult.push(adx[adxIdx]);
                    adxIdx++;
                }
            }
            
            return {
                plusDI: plusDI,
                minusDI: minusDI,
                adx: adxResult
            };
        }
        
        // Wilder's Smoothing
        function wilderSmoothing(values, period) {
            const result = [];
            let sum = 0;
            
            for (let i = 0; i < values.length; i++) {
                if (i < period) {
                    sum += values[i];
                    if (i === period - 1) {
                        result[i] = sum;
                    } else {
                        result.push(null);
                    }
                } else {
                    result[i] = result[i - 1] - (result[i - 1] / period) + values[i];
                }
            }
            
            return result;
        }
        
        // ============ 新增：KDJ计算 ============
        function calculateKDJ(data, rsvPeriod, kPeriod, dPeriod) {
            const k = [];
            const d = [];
            const j = [];
            
            for (let i = 0; i < data.length; i++) {
                if (i < rsvPeriod - 1) {
                    k.push(null);
                    d.push(null);
                    j.push(null);
                    continue;
                }
                
                // 计算RSV
                let lowest = data[i].low;
                let highest = data[i].high;
                
                for (let j = 0; j < rsvPeriod; j++) {
                    lowest = Math.min(lowest, data[i - j].low);
                    highest = Math.max(highest, data[i - j].high);
                }
                
                const rsv = highest === lowest ? 50 : ((data[i].close - lowest) / (highest - lowest)) * 100;
                
                // 计算K值
                if (i === rsvPeriod - 1) {
                    k[i] = (2 / 3) * 50 + (1 / 3) * rsv; // 初始K值=50
                } else {
                    k[i] = (kPeriod - 1) / kPeriod * k[i - 1] + (1 / kPeriod) * rsv;
                }
                
                // 计算D值
                if (i === rsvPeriod - 1) {
                    d[i] = (2 / 3) * 50 + (1 / 3) * k[i]; // 初始D值=50
                } else {
                    d[i] = (dPeriod - 1) / dPeriod * d[i - 1] + (1 / dPeriod) * k[i];
                }
                
                // 计算J值
                j[i] = 3 * k[i] - 2 * d[i];
            }
            
            return { k, d, j };
        }
        
        // ============ 新增：VWAP计算 ============
        function calculateVWAP(data) {
            const vwap = [];
            let cumulativeVolumePrice = 0;
            let cumulativeVolume = 0;
            
            for (let i = 0; i < data.length; i++) {
                // VWAP = ∑(典型价格 × 成交量) / ∑成交量
                // 典型价格 = (High + Low + Close) / 3
                const typicalPrice = (data[i].high + data[i].low + data[i].close) / 3;
                cumulativeVolumePrice += typicalPrice * data[i].volume;
                cumulativeVolume += data[i].volume;
                
                vwap.push(cumulativeVolumePrice / cumulativeVolume);
            }
            
            return vwap;
        }

        function updateStats() {
            const closes = stockData.map(d => d.close);
            const volumes = stockData.map(d => d.volume);
            
            const latestClose = closes[closes.length - 1];
            const prevClose = closes[closes.length - 2];
            const change = latestClose - prevClose;
            const changePercent = (change / prevClose * 100).toFixed(2);
            
            const mean = closes.reduce((a, b) => a + b) / closes.length;
            const max = Math.max(...closes);
            const min = Math.min(...closes);
            
            const statsHTML = `
                <div class="stat-item">
                    <div class="stat-label">最新收盘价</div>
                    <div class="stat-value">${latestClose.toFixed(2)}</div>
                    <div class="stat-change ${change >= 0 ? 'positive' : 'negative'}">
                        ${change >= 0 ? '+' : ''}${change.toFixed(2)} (${changePercent}%)
                    </div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">平均价</div>
                    <div class="stat-value">${mean.toFixed(2)}</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">最高价</div>
                    <div class="stat-value">${max.toFixed(2)}</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">最低价</div>
                    <div class="stat-value">${min.toFixed(2)}</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">平均成交量</div>

        window.addEventListener('load', () => {
            console.log('页面加载完成，开始加载数据...');
            // 延迟1秒加载，确保Lightweight Charts库已加载
            setTimeout(() => {
                loadData();
            }, 1000);
        });
        
        // 响应窗口大小变化
        window.addEventListener('resize', () => {
            if (stockData.length > 0) {
                updateCharts();
            }
        });
    </script>
</body>
</html>
