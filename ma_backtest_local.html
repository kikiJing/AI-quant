<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>均线策略回测系统</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #0d1117; color: #e0e0e0; min-height: 100vh;
            display: flex; flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
            padding: 16px 24px;
            border-bottom: 1px solid #30363d;
            display: flex; align-items: center; gap: 24px;
            flex-wrap: wrap;
        }
        .header h1 { font-size: 20px; color: #f0f6fc; font-weight: 600; }
        .header h1 span { color: #388bfd; }
        .header-info { font-size: 13px; color: #8b949e; }
        .header-badge {
            padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500;
            background: #238636; color: #fff;
        }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar {
            width: 320px; background: #161b22; border-right: 1px solid #30363d;
            overflow-y: auto; padding: 16px; flex-shrink: 0;
        }
        .sidebar-section { margin-bottom: 20px; }
        .sidebar-title {
            font-size: 13px; color: #f0f6fc; font-weight: 600;
            margin-bottom: 12px; padding-bottom: 8px;
            border-bottom: 1px solid #21262d;
            display: flex; align-items: center; gap: 8px;
        }
        .sidebar-title::before {
            content: ''; display: inline-block; width: 3px; height: 14px;
            background: #388bfd; border-radius: 2px;
        }
        .form-group { margin-bottom: 12px; }
        .form-label {
            display: block; font-size: 12px; color: #8b949e;
            margin-bottom: 4px;
        }
        .form-input, .form-select {
            width: 100%; padding: 8px 10px;
            background: #0d1117; border: 1px solid #30363d;
            border-radius: 6px; color: #e0e0e0; font-size: 13px;
        }
        .form-input:focus, .form-select:focus {
            outline: none; border-color: #388bfd;
        }
        .form-row { display: flex; gap: 8px; }
        .form-row .form-group { flex: 1; }
        .checkbox-group {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px; height: 16px; accent-color: #388bfd;
        }
        .checkbox-group label {
            font-size: 13px; color: #c9d1d9; cursor: pointer;
        }
        .btn {
            padding: 10px 16px; border: none; border-radius: 6px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: #238636; color: #fff; width: 100%; }
        .btn-primary:hover { background: #2ea043; }
        .btn-primary:disabled { background: #30363d; cursor: not-allowed; }
        .btn-secondary {
            background: #21262d; color: #c9d1d9; width: 100%;
            border: 1px solid #30363d;
        }
        .btn-secondary:hover { background: #30363d; }
        .btn-group { display: flex; gap: 8px; margin-top: 16px; }
        .btn-group .btn { flex: 1; }
        .content { flex: 1; overflow-y: auto; padding: 16px; }
        .chart-box {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; padding: 16px; margin-bottom: 16px;
        }
        .chart-title {
            font-size: 14px; color: #f0f6fc; font-weight: 500;
            margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
        }
        .metrics-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px; margin-bottom: 16px;
        }
        .metric-card {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; padding: 16px;
        }
        .metric-label { font-size: 12px; color: #8b949e; margin-bottom: 4px; }
        .metric-value { font-size: 20px; color: #f0f6fc; font-weight: 600; }
        .metric-value.positive { color: #f85149; }
        .metric-value.negative { color: #3fb950; }
        .trades-table {
            width: 100%; border-collapse: collapse; font-size: 13px;
        }
        .trades-table th {
            background: #21262d; color: #8b949e; padding: 8px;
            text-align: left; font-weight: 500;
        }
        .trades-table td { padding: 8px; border-bottom: 1px solid #21262d; }
        .trades-table tr:hover { background: #1c2128; }
        .loading {
            display: none; text-align: center; padding: 40px;
            color: #8b949e;
        }
        .loading.active { display: block; }
        .spinner {
            border: 3px solid #21262d; border-top: 3px solid #388bfd;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .alert {
            padding: 12px; border-radius: 6px; margin-bottom: 16px;
            font-size: 13px; line-height: 1.6;
        }
        .alert-success { background: #0d2818; border: 1px solid #238636; color: #3fb950; }
        .alert-error { background: #3b0d0d; border: 1px solid #f85149; color: #f85149; }
        .alert-warning { background: #1a1f2e; border: 1px solid #d29922; color: #d29922; }
        .file-upload-area {
            border: 2px dashed #30363d;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .file-upload-area:hover {
            border-color: #388bfd;
            color: #388bfd;
        }
        .file-upload-area input[type="file"] {
            display: none;
        }
        code {
            background: #21262d; padding: 2px 6px; border-radius: 3px;
            font-size: 12px; color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>📈</span> 均线策略回测系统</h1>
        <div class="header-info">双均线策略 + 趋势过滤器 + ATR过滤器</div>
        <div class="header-badge" id="envBadge">检测中...</div>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">数据状态</div>
                <div id="envAlert" class="alert alert-warning">
                    ⚠️ 正在检测运行环境...
                </div>
                <div id="dataStatus" style="font-size: 12px; color: #8b949e; margin-top: 8px;"></div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">上传CSV数据</div>
                <div class="file-upload-area" onclick="document.getElementById('csvFileInput').click()">
                    <div>📁 点击上传CSV文件</div>
                    <div style="font-size: 11px; margin-top: 8px;">支持Tushare格式CSV</div>
                    <input type="file" id="csvFileInput" accept=".csv" onchange="handleFileUpload(event)">
                </div>
                <div id="uploadStatus"></div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">股票选择</div>
                <div class="form-group">
                    <label class="form-label">选择股票（仅本地服务器模式可用）</label>
                    <select id="stockSelect" class="form-select" onchange="loadStockData()">
                        <option value="300750.SZ">宁德时代 (300750.SZ) - 科技/新能源</option>
                        <option value="601318.SH">中国平安 (601318.SH) - 金融</option>
                        <option value="600519.SH" selected>贵州茅台 (600519.SH) - 消费</option>
                        <option value="601857.SH">中国石油 (601857.SH) - 能源</option>
                        <option value="002594.SZ">比亚迪 (002594.SZ) - 制造</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">开始日期</label>
                        <input type="date" id="startDate" class="form-input" value="2024-07-03">
                    </div>
                    <div class="form-group">
                        <label class="form-label">结束日期</label>
                        <input type="date" id="endDate" class="form-input" value="2026-07-03">
                    </div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">均线参数</div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">短均线周期</label>
                        <input type="number" id="shortWindow" class="form-input" value="5" min="1" max="50">
                    </div>
                    <div class="form-group">
                        <label class="form-label">长均线周期</label>
                        <input type="number" id="longWindow" class="form-input" value="15" min="1" max="200">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">均线类型</label>
                    <select id="maType" class="form-select">
                        <option value="MA">MA（简单移动平均）</option>
                        <option value="EMA">EMA（指数移动平均）</option>
                    </select>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">信号过滤器</div>
                <div class="checkbox-group">
                    <input type="checkbox" id="trendFilter" checked>
                    <label for="trendFilter">趋势过滤器（120日均线）</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="atrFilter" checked>
                    <label for="atrFilter">ATR过滤器（规避低波动）</label>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">回测参数</div>
                <div class="form-group">
                    <label class="form-label">初始资金（元）</label>
                    <input type="number" id="initialCapital" class="form-input" value="100000" min="1000" step="1000">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">手续费率（%）</label>
                        <input type="number" id="commission" class="form-input" value="0.03" min="0" max="1" step="0.01">
                        <small style="color: #8b949e; font-size: 11px;">万三 = 0.03%</small>
                    </div>
                    <div class="form-group">
                        <label class="form-label">滑点（%）</label>
                        <input type="number" id="slippage" class="form-input" value="0.01" min="0" max="1" step="0.01">
                        <small style="color: #8b949e; font-size: 11px;">万一 = 0.01%</small>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">买入仓位比例（%）</label>
                        <input type="number" id="buyRatio" class="form-input" value="100" min="1" max="100" step="10">
                        <small style="color: #8b949e; font-size: 11px;">100% = 全仓买入</small>
                    </div>
                    <div class="form-group">
                        <label class="form-label">卖出仓位比例（%）</label>
                        <input type="number" id="sellRatio" class="form-input" value="100" min="1" max="100" step="10">
                        <small style="color: #8b949e; font-size: 11px;">100% = 全仓卖出</small>
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="runBacktest()" id="runBtn">🚀 运行回测</button>
            </div>
            <div class="btn-group" style="margin-top: 8px;">
                <button class="btn btn-secondary" onclick="resetParams()">重置参数</button>
            </div>
        </div>

        <div class="content">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <div>正在运行回测，请稍候...</div>
            </div>

            <div id="results" style="display: none;">
                <div class="alert alert-success" id="statusMessage"></div>
                <div class="metrics-grid" id="metricsGrid"></div>
                <div class="chart-box">
                    <div class="chart-title">📊 股价走势 & 交易信号</div>
                    <div id="priceChart" style="height: 500px;"></div>
                </div>
                <div class="chart-box">
                    <div class="chart-title">📈 策略净值曲线</div>
                    <div id="navChart" style="height: 300px;"></div>
                </div>
                <div class="chart-box">
                    <div class="chart-title">📋 交易记录</div>
                    <div id="tradesTable"></div>
                </div>
            </div>

            <div id="welcomeMsg" style="text-align: center; padding: 60px 20px; color: #8b949e;">
                <div style="font-size: 48px; margin-bottom: 20px;">📈</div>
                <div style="font-size: 18px; color: #c9d1d9; margin-bottom: 12px;">欢迎使用均线策略回测系统</div>
                <div style="max-width: 500px; margin: 0 auto; line-height: 1.8; font-size: 14px;">
                    请先选择数据来源：<br>
                    ① 运行 <code>start.command</code> 启动本地服务器，加载真实行情数据<br>
                    ② 或点击左侧"上传CSV数据"按钮，手动上传数据文件
                </div>
            </div>
        </div>
    </div>

    <script src="ma_backtest_local.js"></script>
</body>
</html>
